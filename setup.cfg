[metadata]
name = spotisync
author = Sabdot33
description = Download Spotify Songs
long_description = file: README.md, LICENSE
license = GNU
license_file = LICENSE

[options]
package_dir = =src
python_requires = >=3.8
install_requires =
    async-timeout==4.0.3
    certifi==2024.7.4
    charset-normalizer==3.3.2
    idna==3.7
    load-dotenv==0.1.0
    pillow==10.4.0
    PyQt5==5.15.11
    PyQt5-Qt5==5.15.2
    PyQt5_sip==12.15.0
    pystray==0.19.5
    python-dotenv==1.0.1
    python-xlib==0.33
    redis==5.0.8
    requests==2.32.3
    schedule==1.2.2
    Send2Trash==1.8.3
    setuptools==75.6.0
    six==1.16.0
    spotipy==2.24.0
    urllib3==2.2.2

[options.extras_require]
testing =
    flake8
    tox
    pytest
    pytest-cov
    mypy

[options.package_data]
spotisync = py.typed

[flake8]
max-line-length = 160